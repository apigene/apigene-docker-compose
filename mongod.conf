# Minimal logging for local Docker (errors still go to the container; not forwarded to `docker compose logs`)
# Small dev/on-prem install. The default WiredTiger cache is about half of RAM and
# is OOM-killed (exit 137) on a small VM. 0.25GB is MongoDB's minimum.
storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.25

systemLog:
  destination: file
  path: /dev/null
  quiet: true

net:
  bindIpAll: true
