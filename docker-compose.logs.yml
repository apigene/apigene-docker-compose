# Merged only when LOG_VIEWER=true (see lib/runtime.sh).
# Stdout is unchanged. Each app also appends JSONL under /var/log/olgene.

services:
  backend:
    volumes:
      - apigene_logs:/var/log/olgene
      - ./lib/log-exec.sh:/opt/apigene/log-exec.sh:ro
      - ./lib/log-writer.sh:/opt/apigene/log-writer.sh:ro
    entrypoint: ["/bin/sh", "/opt/apigene/log-exec.sh", "backend", "./start.sh"]
    command: ["app"]

  backend-worker:
    volumes:
      - apigene_logs:/var/log/olgene
      - ./lib/log-exec.sh:/opt/apigene/log-exec.sh:ro
      - ./lib/log-writer.sh:/opt/apigene/log-writer.sh:ro
    entrypoint:
      ["/bin/sh", "/opt/apigene/log-exec.sh", "backend-worker", "./start.sh"]
    command: ["celery"]

  copilot:
    environment:
      LOG_VIEWER: "true"
      LOG_DIR: /var/log/olgene
    volumes:
      - apigene_logs:/var/log/olgene
      - ./lib/log-exec.sh:/opt/apigene/log-exec.sh:ro
      - ./lib/log-writer.sh:/opt/apigene/log-writer.sh:ro
    entrypoint: ["/bin/sh", "/opt/apigene/log-exec.sh", "copilot", "node"]
    command: ["server.js"]

  mcp-gw:
    volumes:
      - apigene_logs:/var/log/olgene
      - ./lib/log-exec.sh:/opt/apigene/log-exec.sh:ro
      - ./lib/log-writer.sh:/opt/apigene/log-writer.sh:ro
    entrypoint: ["/bin/sh", "/opt/apigene/log-exec.sh", "mcp-gw", "node"]
    command: ["dist/server.js"]

  nginx:
    volumes:
      - apigene_logs:/var/log/olgene
      - ./.olgene/nginx-log-viewer.conf:/etc/nginx/log-viewer.conf:ro
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "mkdir -p /var/log/olgene && chmod 1777 /var/log/olgene && sed \"s/listen 8080;/listen $${APIGENE_PORT:-8080};/\" /etc/nginx/nginx.conf.template > /tmp/nginx.conf && exec nginx -c /tmp/nginx.conf -g 'daemon off;'",
      ]

volumes:
  apigene_logs:
