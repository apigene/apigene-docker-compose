name: Integration Tests

on:
  # Manual run from the Actions tab (optional image tag overrides)
  workflow_dispatch:
    inputs:
      image_tag:
        description: Override APIGENE_IMAGE_TAG for all services
        required: false
        type: string
      backend_tag:
        description: Override APIGENE_BACKEND_IMAGE_TAG
        required: false
        type: string
      copilot_tag:
        description: Override APIGENE_COPILOT_IMAGE_TAG
        required: false
        type: string
      mcp_gw_tag:
        description: Override APIGENE_MCP_GW_IMAGE_TAG
        required: false
        type: string
      nginx_tag:
        description: Override APIGENE_NGINX_IMAGE_TAG
        required: false
        type: string

  # Weekly cron — catch public ECR image drift without code changes
  # (Monday 06:00 UTC). Scheduled workflows only run on the default branch.
  schedule:
    - cron: "0 6 * * 1"

  push:
    branches: [main]
  pull_request:

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APIGENE_PORT: "8080"
  MONGO_HOST_PORT: "27018"
  COMPOSE_PROJECT_NAME: apigene-ci
  PUBLIC_ECR_LOGIN_REGION: us-east-1

jobs:
  integration:
    name: Smoke + API integration
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create .env
        run: |
          set -euo pipefail
          cp .env.example .env
          SECRET="$(openssl rand -hex 32)"
          sed -i "s/^AUTH_APIGENE_SECRET_KEY=.*/AUTH_APIGENE_SECRET_KEY=${SECRET}/" .env

          # Stable host ports for the runner
          if grep -qE '^APIGENE_PORT=' .env; then
            sed -i "s/^APIGENE_PORT=.*/APIGENE_PORT=${APIGENE_PORT}/" .env
          else
            echo "APIGENE_PORT=${APIGENE_PORT}" >> .env
          fi
          if grep -qE '^MONGO_HOST_PORT=' .env; then
            sed -i "s/^MONGO_HOST_PORT=.*/MONGO_HOST_PORT=${MONGO_HOST_PORT}/" .env
          else
            echo "MONGO_HOST_PORT=${MONGO_HOST_PORT}" >> .env
          fi
          # Keep .env URL in sync with APIGENE_PORT (avoids smoke-test warning)
          if grep -qE '^NEXT_PUBLIC_SERVER_BASE_URL=' .env; then
            sed -i "s|^NEXT_PUBLIC_SERVER_BASE_URL=.*|NEXT_PUBLIC_SERVER_BASE_URL=http://localhost:${APIGENE_PORT}|" .env
          else
            echo "NEXT_PUBLIC_SERVER_BASE_URL=http://localhost:${APIGENE_PORT}" >> .env
          fi

          set_tag() {
            local key="$1" value="$2"
            [[ -n "$value" ]] || return 0
            if grep -qE "^${key}=" .env; then
              sed -i "s/^${key}=.*/${key}=${value}/" .env
            else
              echo "${key}=${value}" >> .env
            fi
          }

          set_tag APIGENE_IMAGE_TAG "${{ inputs.image_tag || 'latest' }}"
          set_tag APIGENE_BACKEND_IMAGE_TAG "${{ inputs.backend_tag }}"
          set_tag APIGENE_COPILOT_IMAGE_TAG "${{ inputs.copilot_tag }}"
          set_tag APIGENE_MCP_GW_IMAGE_TAG "${{ inputs.mcp_gw_tag }}"
          set_tag APIGENE_NGINX_IMAGE_TAG "${{ inputs.nginx_tag }}"

          echo "Using image tags:"
          grep -E '^APIGENE_(IMAGE|BACKEND|COPILOT|MCP_GW|NGINX)_IMAGE_TAG=' .env || true

      - name: Check AWS secrets
        id: aws-secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ECR_PUBLIC_PULL_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ECR_PUBLIC_PULL_SECRET_ACCESS_KEY }}
        run: |
          if [[ -n "$AWS_ACCESS_KEY_ID" && -n "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "ECR Public pull credentials available."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ECR_PUBLIC_PULL_* secrets not configured."
            echo "Org DEV_AWS_* secrets do not apply to this public repo."
            echo "Add pull-only IAM credentials as repository secrets (see README or docs)."
            echo "Continuing with anonymous pulls and retries."
          fi

      - name: Configure AWS credentials
        if: steps.aws-secrets.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.ECR_PUBLIC_PULL_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ECR_PUBLIC_PULL_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.PUBLIC_ECR_LOGIN_REGION }}

      - name: Login to public ECR
        if: steps.aws-secrets.outputs.configured == 'true'
        run: |
          aws ecr-public get-login-password --region "${PUBLIC_ECR_LOGIN_REGION}" \
            | docker login --username AWS --password-stdin public.ecr.aws

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull images
        run: |
          for attempt in 1 2 3 4 5; do
            if docker compose pull; then
              exit 0
            fi
            echo "Pull failed (attempt ${attempt}/5); retrying in $((attempt * 30))s..."
            sleep $((attempt * 30))
          done
          exit 1

      - name: Start stack
        run: |
          set -euo pipefail
          chmod +x apigene tests/integration.sh
          docker compose up -d

          # Wait until services that ./apigene test asserts are actually ready.
          # HTTP health alone is not enough: nginx Docker healthcheck can still
          # be "starting", and Celery needs longer to print "celery@… ready".
          echo "Waiting for nginx healthy + Celery worker ready..."
          for i in $(seq 1 90); do
            nginx_health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$(docker compose ps -q nginx)" 2>/dev/null || echo missing)"
            celery_ready=0
            worker_id="$(docker compose ps -q backend-worker 2>/dev/null || true)"
            if [[ -n "$worker_id" ]] && docker logs "$worker_id" 2>&1 | grep -qE 'celery@.* ready'; then
              celery_ready=1
            fi

            api_ok=0
            if curl -fsS "http://localhost:${APIGENE_PORT}/nginx-health" >/dev/null 2>&1 \
              && curl -fsS "http://localhost:${APIGENE_PORT}/api/health" 2>/dev/null | grep -q '"status"'; then
              api_ok=1
            fi

            if [[ "$nginx_health" == "healthy" && "$celery_ready" -eq 1 && "$api_ok" -eq 1 ]]; then
              echo "Stack ready after attempt ${i} (nginx=${nginx_health}, celery=ready, api=ok)"
              docker compose ps
              exit 0
            fi

            echo "attempt ${i}/90 — nginx=${nginx_health} celery_ready=${celery_ready} api_ok=${api_ok}"
            sleep 5
          done

          echo "::error::Stack did not become healthy within timeout"
          docker compose ps -a
          docker compose logs --tail=200 backend backend-worker nginx
          exit 1

      - name: Smoke checks (./apigene test)
        run: ./apigene test

      - name: API integration tests
        run: ./tests/integration.sh

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "::group::compose ps"
          docker compose ps -a
          echo "::endgroup::"
          echo "::group::backend logs"
          docker compose logs --tail=300 backend backend-worker
          echo "::endgroup::"
          echo "::group::nginx / mcp-gw / copilot logs"
          docker compose logs --tail=200 nginx mcp-gw copilot
          echo "::endgroup::"

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # Slack status for smoke + API integration (success or failure).
  notify:
    name: Notify Slack
    needs: [integration]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Build Slack payload
        env:
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RAW: ${{ github.event.head_commit.message || github.event.pull_request.title || github.event_name }}
        run: |
          SUBJECT=$(printf '%s' "$RAW" | head -n1 | tr -d '\r' | tr -d '[:cntrl:]')
          if [ -z "$SUBJECT" ]; then
            SUBJECT="No commit message available."
          fi
          case "$INTEGRATION_RESULT" in
            success)
              TITLE="docker-compose integration succeeded"
              HEX="#2EB67D"
              ;;
            failure)
              TITLE="docker-compose integration failed"
              HEX="#E01E5A"
              ;;
            *)
              TITLE="docker-compose integration finished"
              HEX="#ECB22E"
              ;;
          esac
          jq -n \
            --arg title "$TITLE" \
            --arg hex "$HEX" \
            --arg result "$INTEGRATION_RESULT" \
            --arg ref "$REF_NAME" \
            --arg sha "${SHA:0:7}" \
            --arg actor "$ACTOR" \
            --arg event "$EVENT_NAME" \
            --arg msg "$SUBJECT" \
            --arg url "$RUN_URL" \
            '{
              text: ($title + " — " + $ref),
              attachments: [
                {
                  color: $hex,
                  blocks: [
                    {
                      type: "section",
                      text: {
                        type: "mrkdwn",
                        text: ("*" + $title + "* · `" + $ref + "` · `" + $sha + "`\nresult=`" + $result + "` · event=`" + $event + "` · `" + $actor + "`\n" + $msg)
                      }
                    },
                    {
                      type: "actions",
                      elements: [
                        {
                          type: "button",
                          text: {
                            type: "plain_text",
                            text: "View workflow",
                            emoji: false
                          },
                          url: $url
                        }
                      ]
                    }
                  ]
                }
              ]
            }' > "$RUNNER_TEMP/slack-payload.json"

      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_DEPLOYMENT }}
          webhook-type: incoming-webhook
          payload-file-path: ${{ runner.temp }}/slack-payload.json
