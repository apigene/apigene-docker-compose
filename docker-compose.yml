# Apigene — self-hosted Docker Compose stack
#
# One-line install:
#   curl -fsSL https://raw.githubusercontent.com/apigene/apigene-docker-compose/main/install.sh | bash
#
# Quick start (manual):
#   cp .env.example .env   # configure .env
#   ./apigene setup        # first time
#   ./apigene start        # start existing install
#   open http://localhost:$APIGENE_PORT
#
# Nginx is the only public entry point. It routes:
#   /              → copilot (UI)
#   /api/*         → backend
#   /docs, /redoc  → backend
#   /*/mcp         → mcp-gw

name: apigene

x-apigene-env-file: &env-file
  env_file:
    - .env

x-apigene-local-env: &local-env
  MONGO_DB_URL: mongodb://mongo:27017/?directConnection=true
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_CACHE_DB: "1"
  TENANT_NAME: ${TENANT_NAME:-local}
  DEPLOYMENT_TYPE: ${DEPLOYMENT_TYPE:-SaaS}
  # OnPrem only (when DEPLOYMENT_TYPE=OnPrem) — loaded from .env via env_file as well
  LICENSE_PUBLIC_KEY: ${LICENSE_PUBLIC_KEY:-}
  LICENSE_ALGORITHM: ${LICENSE_ALGORITHM:-RS256}
  UVICORN_WORKERS: "1"
  # Local default: http://localhost:$APIGENE_PORT. Set NEXT_PUBLIC_SERVER_BASE_URL for a
  # custom domain, LAN IP, or HTTPS URL; ALLOWED_ORIGINS follows unless overridden.
  NEXT_PUBLIC_SERVER_BASE_URL: ${NEXT_PUBLIC_SERVER_BASE_URL:-http://localhost:${APIGENE_PORT:-8080}}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-${NEXT_PUBLIC_SERVER_BASE_URL:-http://localhost:${APIGENE_PORT:-8080}}}

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--config", "/etc/mongod.conf"]
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongod.conf:/etc/mongod.conf:ro
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/27017'"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--loglevel", "warning"]
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    image: public.ecr.aws/apigene/apigene-backend:${APIGENE_BACKEND_IMAGE_TAG:-${APIGENE_IMAGE_TAG:-latest}}
    platform: linux/amd64
    restart: unless-stopped
    <<: *env-file
    command: ["app"]
    environment:
      <<: *local-env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/api/health'')"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  backend-worker:
    image: public.ecr.aws/apigene/apigene-backend:${APIGENE_BACKEND_IMAGE_TAG:-${APIGENE_IMAGE_TAG:-latest}}
    platform: linux/amd64
    restart: unless-stopped
    <<: *env-file
    command: ["celery"]
    environment:
      <<: *local-env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No HTTP server — confirm the Celery worker process is running.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'celery.*worker'",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  copilot:
    image: public.ecr.aws/apigene/apigene-copilot:${APIGENE_COPILOT_IMAGE_TAG:-${APIGENE_IMAGE_TAG:-latest}}
    platform: linux/amd64
    restart: unless-stopped
    <<: *env-file
    network_mode: service:nginx
    environment:
      <<: *local-env
    depends_on:
      nginx:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:3000/client-api/version >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  mcp-gw:
    image: public.ecr.aws/apigene/apigene-mcp-gw:${APIGENE_MCP_GW_IMAGE_TAG:-${APIGENE_IMAGE_TAG:-latest}}
    platform: linux/amd64
    restart: unless-stopped
    <<: *env-file
    environment:
      <<: *local-env
      APIGENE_URL: http://nginx
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:8001/version >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  nginx:
    image: public.ecr.aws/apigene/apigene-nginx:${APIGENE_NGINX_IMAGE_TAG:-${APIGENE_IMAGE_TAG:-latest}}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      APIGENE_PORT: ${APIGENE_PORT:-8080}
    ports:
      # Same port host↔container so Copilot (network_mode: service:nginx) can
      # reach http://localhost:$APIGENE_PORT for server-side API calls.
      - "${APIGENE_PORT:-8080}:${APIGENE_PORT:-8080}"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf.template:ro
    entrypoint:
      [
        "/bin/sh",
        "-c",
        "sed \"s/listen 8080;/listen $${APIGENE_PORT:-8080};/\" /etc/nginx/nginx.conf.template > /tmp/nginx.conf && exec nginx -c /tmp/nginx.conf -g 'daemon off;'",
      ]
    depends_on:
      backend:
        condition: service_healthy
      mcp-gw:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1/nginx-health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  mongo_data:
